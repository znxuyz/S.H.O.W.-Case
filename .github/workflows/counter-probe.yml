name: counter-probe (temporary)
on:
  push:
    branches: [claude/peaceful-euler-r81eh7]
    paths: ['.github/workflows/counter-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          O='Origin: https://znxuyz.github.io'
          for u in \
            https://api.counterapi.dev/v1/znxuyz-show-case/site-views \
            https://api.counterapi.dev/v1/znxuyz-show-case/probe-test/up \
            https://abacus.jasoncameron.dev/get/znxuyz-show-case/site-views \
            https://abacus.jasoncameron.dev/hit/znxuyz-show-case/probe-test \
            https://countapi.mileshilliard.com/api/v1/hit/znxuyz-show-case-probe-test \
            https://countapi.mileshilliard.com/api/v1/get/znxuyz-show-case-probe-test \
            https://api.counterapi.dev/v2/znxuyz/probe-test/up ; do
            echo "=== $u"
            curl -sS -m 15 -i -H "$O" "$u" | head -25 || echo FAIL
            echo
          done
